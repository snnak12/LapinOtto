<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otto Robot - Dans ve Kontrol</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid #334155;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.on {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    button {
      border: none;
      outline: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-connect {
      background: var(--accent);
      color: #0f172a;
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .label {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 4px;
    }

    /* Yön Tuşları */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--card);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #334155;
    }

    .btn-dir {
      background: #334155;
      color: #fff;
      aspect-ratio: 1;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-dir:active {
      background: var(--accent);
      color: #000;
    }

    .btn-stop {
      background: var(--danger);
      color: #fff;
      font-size: 0.9rem;
    }

    .btn-stop:active {
      background: #b91c1c;
    }

    /* Dans Butonları - Büyük ve Görünür */
    .dance-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-dance {
      background: #1e293b;
      border: 2px solid #38bdf8;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 12px;
      text-align: left;
    }

    .btn-dance:active, .btn-dance.playing {
      background: #0284c7;
      border-color: #7dd3fc;
      transform: scale(0.98);
    }

    .dance-title {
      font-size: 1rem;
      color: #fff;
    }

    .dance-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .dance-icon {
      font-size: 1.4rem;
    }

    /* Jestler */
    .gesture-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-ges {
      background: var(--card);
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 4px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-ges:active {
      background: var(--accent);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>OTTO ROBOT PANELİ</h1>

    <!-- Bağlantı -->
    <div class="card status-row">
      <div class="status-badge">
        <span class="dot" id="dot"></span>
        <span id="statusTxt">Bağlantı Yok</span>
      </div>
      <button class="btn-connect" id="btnConnect" onclick="toggleBT()">Bağlan</button>
    </div>

    <!-- Sürüş Kumandası -->
    <span class="label">Sürüş Kontrolü</span>
    <div class="dpad">
      <div></div>
      <button class="btn-dir" onpointerdown="send('forward')" onpointerup="send('stop')">▲</button>
      <div></div>

      <button class="btn-dir" onpointerdown="send('left')" onpointerup="send('stop')">◀</button>
      <button class="btn-dir btn-stop" onclick="stopAll()">DUR</button>
      <button class="btn-dir" onpointerdown="send('right')" onpointerup="send('stop')">▶</button>

      <div></div>
      <button class="btn-dir" onpointerdown="send('backward')" onpointerup="send('stop')">▼</button>
      <div></div>
    </div>

    <!-- DANS MENÜSÜ -->
    <span class="label">Müzikli Koreografiler</span>
    <div class="dance-list">
      
      <!-- 1. Smooth Criminal -->
      <button class="btn-dance" id="btn-smooth" onclick="startChoreography('smoothCriminal', 'smooth', this)">
        <div>
          <div class="dance-title">1. Smooth Criminal</div>
          <div class="dance-sub">Michael Jackson • 121 BPM</div>
        </div>
        <div class="dance-icon">🎩</div>
      </button>

      <!-- 2. Party Rock Shuffle -->
      <button class="btn-dance" id="btn-shuffle" onclick="startChoreography('shuffle', 'shuffle', this)">
        <div>
          <div class="dance-title">2. Party Rock (Shuffle)</div>
          <div class="dance-sub">LMFAO • 130 BPM</div>
        </div>
        <div class="dance-icon">👟</div>
      </button>

      <!-- 3. Single Ladies -->
      <button class="btn-dance" id="btn-single" onclick="startChoreography('singleLadies', 'single', this)">
        <div>
          <div class="dance-title">3. Single Ladies</div>
          <div class="dance-sub">Beyoncé • 97 BPM</div>
        </div>
        <div class="dance-icon">💍</div>
      </button>

    </div>

    <!-- Jestler -->
    <span class="label">Hareketler & Jestler</span>
    <div class="gesture-row">
      <button class="btn-ges" onclick="send('happy')"><span>😊</span>Mutlu</button>
      <button class="btn-ges" onclick="send('victory')"><span>✌️</span>Zafer</button>
      <button class="btn-ges" onclick="send('fart')"><span>💨</span>Gaz</button>
      <button class="btn-ges" onclick="send('avoidance')"><span>🛡️</span>Engel</button>
    </div>
  </div>

  <script>
    let device = null;
    let txChar = null;
    let audioCtx = null;
    let isSynthPlaying = false;
    let activeBtn = null;

    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    async function toggleBT() {
      if (device && device.gatt.connected) {
        device.gatt.disconnect();
        return;
      }
      try {
        device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [UART_SERVICE, "0000ffe0-0000-1000-8000-00805f9b34fb"]
        });

        device.addEventListener('gattserverdisconnected', onDisconnect);
        const server = await device.gatt.connect();

        let service;
        try {
          service = await server.getPrimaryService(UART_SERVICE);
          txChar = await service.getCharacteristic(UART_TX);
        } catch(e) {
          service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
          txChar = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
        }

        document.getElementById('dot').classList.add('on');
        document.getElementById('statusTxt').innerText = "Bağlandı";
        document.getElementById('btnConnect').innerText = "Kopart";
      } catch (err) {
        console.log("Hata: " + err);
      }
    }

    function onDisconnect() {
      document.getElementById('dot').classList.remove('on');
      document.getElementById('statusTxt').innerText = "Bağlantı Yok";
      document.getElementById('btnConnect').innerText = "Bağlan";
      txChar = null;
      stopMusic();
    }

    async function send(cmd) {
      if (!txChar) return;
      try {
        const enc = new TextEncoder();
        await txChar.writeValue(enc.encode(cmd + "\n"));
      } catch(e) {
        console.error(e);
      }
    }

    // ==========================================
    // DAHİLİ SYNTHESIZER (HARİCİ MP3 GEREKTİRMEZ)
    // ==========================================
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sawtooth') {
      if (!isSynthPlaying) return;
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    // Notalar tablosu (Hz)
    const NOTES = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77
    };

    // Melodiler
    const MELODIES = {
      smooth: [
        { f: NOTES.A4, d: 0.2 }, { f: NOTES.A4, d: 0.2 }, { f: NOTES.A4, d: 0.2 }, { f: NOTES.G4, d: 0.2 },
        { f: NOTES.A4, d: 0.2 }, { f: NOTES.C5, d: 0.3 }, { f: NOTES.B4, d: 0.2 }, { f: NOTES.G4, d: 0.3 }
      ],
      shuffle: [
        { f: NOTES.E4, d: 0.15 }, { f: NOTES.G4, d: 0.15 }, { f: NOTES.A4, d: 0.15 }, { f: NOTES.E4, d: 0.15 },
        { f: NOTES.D4, d: 0.15 }, { f: NOTES.E4, d: 0.25 }, { f: NOTES.G4, d: 0.25 }
      ],
      single: [
        { f: NOTES.C5, d: 0.2 }, { f: NOTES.A4, d: 0.2 }, { f: NOTES.C5, d: 0.2 }, { f: NOTES.D5, d: 0.3 },
        { f: NOTES.C5, d: 0.2 }, { f: NOTES.A4, d: 0.4 }
      ]
    };

    function startMelodyLoop(trackKey) {
      isSynthPlaying = true;
      const track = MELODIES[trackKey];
      let step = 0;

      function nextNote() {
        if (!isSynthPlaying) return;
        const current = track[step];
        playTone(current.f, current.d);
        step = (step + 1) % track.length;
        setTimeout(nextNote, current.d * 1000 + 50);
      }
      nextNote();
    }

    function startChoreography(cmd, melodyKey, btn) {
      stopMusic();

      activeBtn = btn;
      activeBtn.classList.add('playing');

      // 1. Melodiyi başlat
      startMelodyLoop(melodyKey);

      // 2. Robota komutu gönder
      send(cmd);
    }

    function stopMusic() {
      isSynthPlaying = false;
      if (activeBtn) {
        activeBtn.classList.remove('playing');
        activeBtn = null;
      }
    }

    function stopAll() {
      stopMusic();
      send('stop');
    }
  </script>
</body>
</html>
