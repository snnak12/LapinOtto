<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otto Robot Kontrol Paneli</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0c376a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    /* Üst Köşe Düğmeleri */
    .top-btn {
      position: absolute;
      top: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .top-btn:hover {
      transform: scale(1.08);
    }

    .btn-help {
      left: 20px;
      font-size: 26px;
      font-weight: 800;
      color: #0c376a;
    }

    .btn-bluetooth {
      right: 20px;
    }

    .btn-bluetooth svg {
      width: 26px;
      height: 26px;
      fill: #0c376a;
      transition: fill 0.3s ease;
    }

    .btn-bluetooth.connected {
      background: #2ecc71;
    }

    .btn-bluetooth.connected svg {
      fill: #ffffff;
    }

    /* Ana Kontrol Konteynırı */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 35px;
      gap: 18px;
    }

    /* Yön Kontrol Alanı (Joystick) */
    .joystick-container {
      display: grid;
      grid-template-columns: repeat(3, 68px);
      grid-template-rows: repeat(3, 68px);
      gap: 12px;
      align-items: center;
      justify-items: center;
    }

    .btn-arrow {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-arrow svg {
      width: 32px;
      height: 32px;
      fill: #0c376a;
    }

    .btn-arrow:active {
      transform: scale(0.92);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-stop {
      width: 60px;
      height: 60px;
      background: #e74c3c;
      border-radius: 14px;
      border: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-stop-inner {
      width: 22px;
      height: 22px;
      background: #ffffff;
      border-radius: 4px;
    }

    .btn-stop:active {
      transform: scale(0.92);
    }

    .pos-up { grid-column: 2; grid-row: 1; }
    .pos-left { grid-column: 1; grid-row: 2; }
    .pos-stop { grid-column: 2; grid-row: 2; }
    .pos-right { grid-column: 3; grid-row: 2; }
    .pos-down { grid-column: 2; grid-row: 3; }

    /* Hız Ayarı Çubuğu */
    .speed-container {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
    }

    .speed-slider {
      -webkit-appearance: none;
      width: 140px;
      height: 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00d2d3;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* Düğme Grupları */
    .actions-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      max-width: 900px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px;
      border-radius: 12px;
      gap: 5px;
      backdrop-filter: blur(6px);
    }

    .btn-action {
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.15s ease;
    }

    .btn-action:active {
      transform: translateY(2px);
    }

    /* Renk Kodları */
    .btn-mutlu { background-color: #3b71ca; }
    .btn-galibiyet { background-color: #28a745; }
    .btn-huzunlu { background-color: #17a2b8; }
    .btn-uykulu { background-color: #e67e22; }
    .btn-karismis { background-color: #e056fd; }
    .btn-hatali { background-color: #6c757d; }
    .btn-gazli { background-color: #dfe6e9; color: #2d3436; }
    
    .btn-moonwalk { background-color: #8e44ad; }
    .btn-smooth { background-color: #2c3e50; }
    .btn-mode { background-color: #d35400; }

    /* Alt Bilgi İmzası */
    .footer-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      padding: 15px 10px 5px 10px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Sol Üst Yardım Butonu -->
  <button class="top-btn btn-help" onclick="yardimGoster()">?</button>

  <!-- Sağ Üst Bağlantı Butonu -->
  <button id="btBtn" class="top-btn btn-bluetooth" onclick="baglantiKur()" title="Bluetooth HC-05'e Bağlan">
    <svg viewBox="0 0 24 24">
      <path d="M14.88 16.29L13 18.17V14.41M13 5.83l1.88 1.88-1.88 1.88M7 7.07L12 12l-5 4.93 1.41 1.41L13 13.83v7.17l4.29-4.29-3.29-3.29 3.29-3.29L13 6V-1.17L8.41 3.41 7 4.83l5 5-5-5-1.41 1.41z"/>
      <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
    </svg>
  </button>

  <div class="main-content">
    <!-- Yön Tuşları -->
    <div class="joystick-container">
      <button class="btn-arrow pos-up" onclick="komutGonder('forward')">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
      </button>
      <button class="btn-arrow pos-left" onclick="komutGonder('left')">
        <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
      </button>
      <button class="btn-stop pos-stop" onclick="komutGonder('stop')">
        <div class="btn-stop-inner"></div>
      </button>
      <button class="btn-arrow pos-right" onclick="komutGonder('right')">
        <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
      </button>
      <button class="btn-arrow pos-down" onclick="komutGonder('backward')">
        <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
      </button>
    </div>

    <!-- Hız Kontrolü -->
    <div class="speed-container">
      <span>Hız Ayarı</span>
      <input type="range" id="speedRange" class="speed-slider" min="0" max="5" value="2">
      <span>🔧</span>
    </div>

    <!-- Komut Grupları -->
    <div class="actions-wrapper">
      <!-- Duygular -->
      <div class="button-group">
        <button class="btn-action btn-mutlu" onclick="komutGonder('happy')"><span>😊</span> Mutlu</button>
        <button class="btn-action btn-galibiyet" onclick="komutGonder('victory')"><span>😃</span> Galibiyet</button>
        <button class="btn-action btn-huzunlu" onclick="komutGonder('sad')"><span>😭</span> Hüzünlü</button>
        <button class="btn-action btn-uykulu" onclick="komutGonder('sleeping')"><span>😴</span> Uykulu</button>
        <button class="btn-action btn-karismis" onclick="komutGonder('confused')"><span>😕</span> Kafası Karışmış</button>
        <button class="btn-action btn-hatali" onclick="komutGonder('fail')"><span>😬</span> Hatalı</button>
        <button class="btn-action btn-gazli" onclick="komutGonder('fart')"><span>💨</span> Gazlı</button>
      </div>

      <!-- Danslar ve Otonom Modlar -->
      <div class="button-group">
        <button class="btn-action btn-moonwalk" onclick="komutGonder('moonwalkLeft')"><span>🕺</span> MoonWalk Sol</button>
        <button class="btn-action btn-moonwalk" onclick="komutGonder('moonwalkRight')"><span>💃</span> MoonWalk Sağ</button>
        <button class="btn-action btn-smooth" onclick="komutGonder('smoothCriminal')"><span>🎩</span> SmoothCriminal</button>
        <button class="btn-action btn-mode" onclick="komutGonder('avoidance')"><span>🛡️</span> Engellerden Kaç</button>
        <button class="btn-action btn-mode" onclick="komutGonder('force')"><span>✋</span> El Takip (Force)</button>
      </div>
    </div>
  </div>

  <!-- Alt Bilgi / İsim İmza -->
  <footer class="footer-text">
    Bu web arayüz Robotik Kodlama öğretmeni Hakan KOÇ tarafından yapılmıştır.
  </footer>

  <!-- Smooth Criminal Ses Dosyası -->
  <audio id="audioSmooth" src="smooth.mp3" preload="auto"></audio>

  <script>
    let port = null;
    let writer = null;
    const smoothAudio = document.getElementById("audioSmooth");

    // Web Serial üzerinden Sanal Bluetooth COM Portuna Bağlanma
    async function baglantiKur() {
      if (!("serial" in navigator)) {
        alert("Tarayıcınız Web Serial API desteklemiyor. Lütfen Google Chrome veya Microsoft Edge kullanın.");
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();

        document.getElementById('btBtn').classList.add('connected');
        alert("HC-05 Robot bağlantısı başarıyla kuruldu!");
      } catch (err) {
        console.error("Bağlantı Hatası:", err);
        alert("Bağlantı kurulamadı veya iptal edildi.");
      }
    }

    // Robota Komut Gönderme ve Müzik Yönetim Fonksiyonu
    async function komutGonder(anahtar) {
      if (!writer) {
        alert("Lütfen önce sağ üstteki Bluetooth simgesine basarak robota bağlanın.");
        return;
      }

      try {
        // Müzik Kontrolü: smoothCriminal seçildiğinde başlat, başka bir butonda durdur
        if (anahtar === 'smoothCriminal') {
          smoothAudio.currentTime = 0;
          smoothAudio.play().catch(e => console.log("Ses oynatma engeli:", e));
        } else {
          smoothAudio.pause();
          smoothAudio.currentTime = 0;
        }

        // Arduino kodundaki move_speed[n] hız indeksini komutun sonuna ekler
        const secilenHiz = document.getElementById('speedRange').value;
        const paket = anahtar + secilenHiz + "\n";
        
        await writer.write(paket);
        console.log("Gönderilen Veri:", paket.trim());
      } catch (err) {
        console.error("Veri Gönderme Hatası:", err);
      }
    }

    function yardimGoster() {
      alert("Kullanım Rehberi:\n1. Bilgisayarınızın Bluetooth menüsünden HC-05 robotu eşleştirin (Şifre: 1234 veya 0000).\n2. Sağ üstteki Bluetooth butonuna tıklayıp listeden sanal COM portunu seçin.\n3. Butonları ve Hız Ayarını kullanarak robotunuzu kablosuz olarak yönetin.");
    }
  </script>
</body>
</html>
