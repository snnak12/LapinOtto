<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otto Robot Kontrol Paneli</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 5px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .status-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
    }

    .dot.connected {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    button {
      border: none;
      outline: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .btn-connect {
      background-color: var(--accent);
      color: #0f172a;
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-connect:hover {
      background-color: var(--accent-hover);
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 5px 0 2px 5px;
    }

    /* Yön Kumandası Grid */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid #334155;
    }

    .btn-move {
      background-color: #334155;
      color: var(--text);
      aspect-ratio: 1;
      font-size: 1.4rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .btn-move:active {
      background-color: var(--accent);
      color: #0f172a;
      transform: scale(0.96);
    }

    .btn-stop {
      background-color: var(--danger);
      color: white;
      font-size: 0.9rem;
    }

    .btn-stop:active {
      background-color: #b91c1c;
      transform: scale(0.96);
    }

    /* Dans Menüsü */
    .dance-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-dance {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid #475569;
      color: var(--text);
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 12px;
    }

    .btn-dance:active, .btn-dance.playing {
      border-color: var(--accent);
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: scale(0.98);
    }

    .dance-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .dance-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .dance-artist {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .dance-icon {
      font-size: 1.2rem;
    }

    /* Mimikler & Jestler */
    .gestures-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-gesture {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text);
      padding: 10px 4px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-gesture:active {
      background-color: var(--accent);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>OTTO ROBOT</h1>
    </div>

    <!-- Bağlantı Alanı -->
    <div class="status-card">
      <div class="status-indicator">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Bağlantı Yok</span>
      </div>
      <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">Bağlan</button>
    </div>

    <!-- Yön Kumandası -->
    <div class="section-title">Manuel Sürüş</div>
    <div class="d-pad">
      <div></div>
      <button class="btn-move" onpointerdown="sendCommand('forward')" onpointerup="sendCommand('stop')">▲</button>
      <div></div>

      <button class="btn-move" onpointerdown="sendCommand('left')" onpointerup="sendCommand('stop')">◀</button>
      <button class="btn-move btn-stop" onclick="stopAll()">DUR</button>
      <button class="btn-move" onpointerdown="sendCommand('right')" onpointerup="sendCommand('stop')">▶</button>

      <div></div>
      <button class="btn-move" onpointerdown="sendCommand('backward')" onpointerup="sendCommand('stop')">▼</button>
      <div></div>
    </div>

    <!-- Müzikli Koreografiler -->
    <div class="section-title">Müzikli Danslar</div>
    <div class="dance-grid">
      <!-- Smooth Criminal -->
      <button class="btn-dance" id="btn-smooth" onclick="playChoreography('smoothCriminal', 'audio-smooth', this)">
        <div class="dance-info">
          <span class="dance-title">Smooth Criminal</span>
          <span class="dance-artist">Michael Jackson (121 BPM)</span>
        </div>
        <span class="dance-icon">🎩</span>
      </button>

      <!-- Party Rock (Shuffle) -->
      <button class="btn-dance" id="btn-shuffle" onclick="playChoreography('shuffle', 'audio-shuffle', this)">
        <div class="dance-info">
          <span class="dance-title">Party Rock Shuffle</span>
          <span class="dance-artist">LMFAO (130 BPM)</span>
        </div>
        <span class="dance-icon">👟</span>
      </button>

      <!-- Single Ladies -->
      <button class="btn-dance" id="btn-single" onclick="playChoreography('singleLadies', 'audio-single', this)">
        <div class="dance-info">
          <span class="dance-title">Single Ladies</span>
          <span class="dance-artist">Beyoncé (97 BPM)</span>
        </div>
        <span class="dance-icon">💍</span>
      </button>
    </div>

    <!-- Hızlı Jestler -->
    <div class="section-title">Jestler & Modlar</div>
    <div class="gestures-grid">
      <button class="btn-gesture" onclick="sendCommand('happy')"><span>😊</span>Mutlu</button>
      <button class="btn-gesture" onclick="sendCommand('sad')"><span>😢</span>Üzgün</button>
      <button class="btn-gesture" onclick="sendCommand('victory')"><span>✌️</span>Zafer</button>
      <button class="btn-gesture" onclick="sendCommand('avoidance')"><span>🛡️</span>Otonom</button>
    </div>
  </div>

  <!-- Ses Dosyaları -->
  <!-- Kendi mp3 dosyalarınızı bu HTML dosyasıyla aynı klasöre koyup isimleri eşitleyebilirsiniz -->
  <audio id="audio-smooth" src="smooth_criminal.mp3" preload="auto"></audio>
  <audio id="audio-shuffle" src="party_rock.mp3" preload="auto"></audio>
  <audio id="audio-single" src="single_ladies.mp3" preload="auto"></audio>

  <script>
    let bluetoothDevice = null;
    let rxTxCharacteristic = null;
    let currentAudio = null;
    let activeDanceButton = null;

    // Standart BLE Nordic UART Servisleri (HM-10, ESP32 BLE vb.)
    const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    async function toggleConnect() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
        return;
      }

      try {
        updateStatus("Bağlanıyor...", false);
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [UART_SERVICE_UUID, "0000ffe0-0000-1000-8000-00805f9b34fb"]
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await bluetoothDevice.gatt.connect();
        
        let service;
        try {
          service = await server.getPrimaryService(UART_SERVICE_UUID);
          rxTxCharacteristic = await service.getCharacteristic(UART_TX_UUID);
        } catch(e) {
          // Alternatif HC-08 / HM-10 UUID
          service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
          rxTxCharacteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
        }

        updateStatus("Bağlandı", true);
        document.getElementById('btnConnect').innerText = "Kopart";
      } catch (error) {
        console.log("Bağlantı hatası: " + error);
        updateStatus("Bağlantı Hatası", false);
      }
    }

    function onDisconnected() {
      updateStatus("Bağlantı Kesildi", false);
      document.getElementById('btnConnect').innerText = "Bağlan";
      rxTxCharacteristic = null;
      stopMusic();
    }

    function updateStatus(text, isConnected) {
      document.getElementById('statusText').innerText = text;
      const dot = document.getElementById('statusDot');
      if (isConnected) dot.classList.add('connected');
      else dot.classList.remove('connected');
    }

    async function sendCommand(cmd) {
      console.log("Komut:", cmd);
      if (!rxTxCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        await rxTxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
      } catch (err) {
        console.error("Yazma Hatası:", err);
      }
    }

    // Müzikli Dans Yürütücü
    function playChoreography(cmd, audioId, btnElement) {
      stopMusic();

      // Müziği çal
      currentAudio = document.getElementById(audioId);
      if (currentAudio) {
        currentAudio.currentTime = 0;
        currentAudio.play().catch(e => console.log("Otomatik oynatma kısıtlandı:", e));
      }

      // Buton stili
      activeDanceButton = btnElement;
      activeDanceButton.classList.add('playing');

      // Robota komutu gönder
      sendCommand(cmd);

      // Şarkı bitince temizle
      currentAudio.onended = () => {
        stopAll();
      };
    }

    function stopMusic() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if (activeDanceButton) {
        activeDanceButton.classList.remove('playing');
        activeDanceButton = null;
      }
    }

    function stopAll() {
      stopMusic();
      sendCommand('stop');
    }
  </script>
</body>
</html>
